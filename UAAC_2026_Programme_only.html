<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>UAAC–AAUC 2026 — Programme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap');
:root{
  --red:#C0392B;--red-dark:#922B21;--red-light:#FADBD8;--red-xlight:#FDF2F0;
  --gold:#897334;--gold-light:#F3EBCF;--gold-faint:#FAF7EE;
  --g900:#1A1A1A;--g800:#2D2D2D;--g600:#555;--g400:#9A9A9A;--g200:#DEDEDE;--g100:#F0EFED;--g50:#F8F7F5;--white:#fff;
  --serif:'Playfair Display',Georgia,serif;--sans:'Source Sans 3','Helvetica Neue',sans-serif;
  --shadow-sm:0 1px 4px rgba(0,0,0,.07);--shadow-md:0 4px 14px rgba(0,0,0,.10);--tr:.2s ease
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;font-size:16px}
body{font-family:var(--sans);font-size:.9375rem;line-height:1.65;color:var(--g600);background:var(--g50)}
p{margin-bottom:.7em}p:last-child{margin-bottom:0}

.page-wrap{display:grid;grid-template-columns:285px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"hdr hdr" "nav main";min-height:100vh}

/* ── Header ── */
.site-header{grid-area:hdr;background:var(--g900);color:var(--white);display:flex;align-items:center;padding:.5rem 1.8rem;position:sticky;top:0;z-index:200;border-bottom:3px solid var(--red);gap:1.5rem;min-height:58px}
.hdr-logos{display:flex;align-items:center;gap:1.2rem}
.hdr-logo-img{height:32px;width:auto;display:block;filter:brightness(0) invert(1)}
.hdr-logo-img.concordia{height:28px}
.hdr-divider{width:1px;height:30px;background:rgba(255,255,255,.2);flex-shrink:0}
.hdr-text{display:flex;flex-direction:column;gap:.1rem}
.hdr-wordmark{font-family:var(--serif);font-size:.85rem;font-weight:700;color:rgba(255,255,255,.9);letter-spacing:.01em;line-height:1.2}
.hdr-sub{font-family:var(--sans);font-size:.62rem;font-weight:400;letter-spacing:.04em;color:var(--g400);line-height:1.2}

.hdr-link{font-family:var(--sans);font-size:.75rem;font-weight:600;color:rgba(255,255,255,.85);text-decoration:none;white-space:nowrap;border:1px solid rgba(255,255,255,.3);border-radius:3px;padding:.3rem .7rem;margin-left:auto;transition:background var(--tr),color var(--tr)}
.hdr-link:hover{background:rgba(255,255,255,.12);color:var(--white)}

/* ── Sidebar ── */
.site-nav{grid-area:nav;background:var(--white);border-right:1px solid var(--g200);position:sticky;top:58px;height:calc(100vh - 58px);overflow-y:auto;overscroll-behavior:contain;padding:.6rem 0 2rem}
.nav-heading{font-family:var(--sans);font-size:.57rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--g400);padding:0 1rem .5rem;border-bottom:1px solid var(--g100);margin-bottom:.3rem}
.toc-day{list-style:none;border-bottom:2px solid var(--g100)}
.toc-day-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;background:var(--red);border:none;cursor:pointer;gap:.4rem;text-align:left}
.toc-day-btn:hover{background:var(--red-dark)}
.toc-day-label{font-family:var(--sans);font-size:.7rem;font-weight:700;color:var(--white);letter-spacing:.02em;flex:1;line-height:1.3}
.toc-day-chevron{width:14px;height:14px;stroke:rgba(255,255,255,.7);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform var(--tr)}
.toc-day-btn[aria-expanded="false"] .toc-day-chevron{transform:rotate(-90deg)}
.toc-day-body{overflow:hidden}.toc-day-body.collapsed{display:none}
.toc-slot{border-bottom:1px solid var(--g100)}
.toc-slot-btn{width:100%;display:flex;align-items:center;justify-content:space-between;padding:.4rem 1rem .4rem 1.2rem;background:var(--g50);border:none;border-bottom:1px solid var(--g100);cursor:pointer;gap:.4rem;text-align:left}
.toc-slot-btn:hover{background:var(--red-xlight)}
.toc-slot-label{font-family:var(--sans);font-size:.65rem;font-weight:600;color:var(--red-dark);flex:1;letter-spacing:.01em}
.toc-slot-chevron{width:11px;height:11px;stroke:var(--red);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform var(--tr)}
.toc-slot-btn[aria-expanded="false"] .toc-slot-chevron{transform:rotate(-90deg)}
.toc-slot-list{list-style:none;overflow:hidden}.toc-slot-list.collapsed{display:none}
.toc-item{border-bottom:1px solid var(--g100)}
.toc-link{display:flex;align-items:flex-start;gap:.38rem;padding:.4rem 1rem .4rem 1.4rem;text-decoration:none;color:var(--g600);font-size:.7rem;line-height:1.3;transition:background var(--tr),color var(--tr)}
.toc-link:hover{background:var(--red-xlight);color:var(--red-dark)}
.toc-link.active{background:var(--red-light);color:var(--red-dark);border-left:3px solid var(--red);padding-left:calc(1.4rem - 3px)}
.toc-num{flex-shrink:0;font-family:var(--sans);font-size:.63rem;font-weight:800;color:var(--red);min-width:24px;padding-top:.05rem;letter-spacing:.02em}
.toc-link.active .toc-num{color:var(--red-dark)}
.toc-text{flex:1}.toc-title{display:block}
.toc-chair{display:block;font-style:italic;font-size:.63rem;color:var(--g400);margin-top:.02rem}

/* ── Main ── */
.site-main{grid-area:main;padding:2rem 2.2rem 5rem;max-width:900px}

/* ── Loading / Error ── */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 2rem;gap:1rem;color:var(--g400)}
.loading-spinner{width:36px;height:36px;border:3px solid var(--g200);border-top-color:var(--red);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-state{background:var(--red-xlight);border:1px solid var(--red-light);border-radius:4px;padding:1.2rem 1.5rem;color:var(--red-dark);font-size:.9rem;margin:2rem}
.error-state strong{display:block;margin-bottom:.4rem}

/* ── Session card ── */
.session-card{background:var(--white);border:1px solid var(--g200);border-top:none;border-radius:2px;margin-bottom:2.2rem;overflow:hidden;box-shadow:var(--shadow-sm);scroll-margin-top:70px;transition:box-shadow var(--tr)}
.session-card:hover{box-shadow:var(--shadow-md)}
.session-header{background:var(--red);padding:.78rem 1.35rem .48rem}
.session-header.type-roundtable{background:#7B3535}
.session-header.type-workshop{background:#3E3B68}
.session-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.2rem;gap:.8rem}
.session-badge{font-family:var(--sans);font-size:.55rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.session-schedule{display:flex;align-items:center;gap:.28rem;font-family:var(--sans);font-size:.65rem;color:rgba(255,255,255,.9);background:rgba(0,0,0,.2);padding:.16rem .52rem;border-radius:20px;white-space:nowrap}
.sched-date{font-weight:400;opacity:.85}.sched-time{font-weight:700}.sched-sep{opacity:.4}
.session-title{font-family:var(--serif);font-size:1.18rem;font-weight:700;color:var(--white);line-height:1.28;margin-bottom:.28rem;display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap}
.session-id-pill{flex-shrink:0;font-family:var(--sans);font-size:.72rem;font-weight:800;color:var(--white);background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);border-radius:4px;padding:.08rem .42rem;letter-spacing:.06em;line-height:1.5;align-self:center}
.session-meta{display:flex;align-items:center;padding:.22rem 0 .06rem}
.meta-loc{font-family:var(--sans);font-size:.65rem;color:rgba(255,255,255,.68)}
.session-body{padding:1.1rem 1.35rem}
.field-label{display:inline-block;font-family:var(--sans);font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-right:.3rem}
.chairs-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 2rem;margin-bottom:.35rem}
.person-col{min-width:0}
.person-role{font-family:var(--sans);font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:.15rem}
.person-name-row{display:flex;align-items:center;gap:.38rem;flex-wrap:wrap;margin-bottom:.1rem}
.person-name{font-family:var(--serif);font-size:1.04rem;font-weight:700;color:var(--g900);line-height:1.2}
.pres-name{font-size:.94rem!important;color:var(--g800)!important}
.person-affil{font-size:.77rem;font-style:italic;color:var(--g400);margin-bottom:.1rem}
.bio-toggle{display:inline-flex;align-items:center;gap:.2rem;background:none;border:1px solid var(--gold);border-radius:2px;padding:.08rem .34rem;font-family:var(--sans);font-size:.57rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);cursor:pointer;white-space:nowrap;transition:background var(--tr),color var(--tr);flex-shrink:0;line-height:1.5}
.bio-toggle:hover{background:var(--gold-light)}.bio-toggle[aria-expanded="true"]{background:var(--gold);color:var(--white)}
.bio-toggle svg,.desc-toggle svg{width:8px;height:8px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:transform var(--tr);flex-shrink:0}
.bio-toggle[aria-expanded="true"] svg,.desc-toggle[aria-expanded="true"] svg{transform:rotate(180deg)}
.bio-panel{margin:.26rem 0 .38rem;padding:.48rem .78rem;background:var(--gold-faint);border-left:3px solid var(--gold);border-radius:0 2px 2px 0;font-size:.8rem;line-height:1.65;color:var(--g600);animation:sld .18s ease}
.bio-panel[hidden]{display:none}
.desc-toggle{display:inline-flex;align-items:center;gap:.2rem;background:none;border:1px solid var(--red);border-radius:2px;padding:.08rem .34rem;font-family:var(--sans);font-size:.57rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red);cursor:pointer;white-space:nowrap;transition:background var(--tr),color var(--tr);flex-shrink:0;line-height:1.5;margin-top:.3rem}
.desc-toggle:hover{background:var(--red-xlight)}.desc-toggle[aria-expanded="true"]{background:var(--red);color:var(--white)}
.desc-panel{margin:.26rem 0 .32rem;padding:.48rem .78rem;background:var(--red-xlight);border-left:3px solid var(--red);border-radius:0 2px 2px 0;font-size:.8rem;line-height:1.65;color:var(--g600);animation:sld .18s ease}
.desc-panel[hidden]{display:none}
@keyframes sld{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:translateY(0)}}
.session-rule{border:none;border-top:2px solid var(--g100);margin:.82rem 0}
.session-description{font-size:.9rem;line-height:1.72;color:var(--g600);margin-bottom:.5rem}
.session-keywords{font-size:.76rem;color:var(--g400);margin-bottom:.48rem}.kw-text{font-style:italic}
.presentations-section{border-top:1px solid var(--g200);margin-top:.78rem;padding-top:.72rem}
.presentations-heading{margin-bottom:.62rem}
.presentations-indent{border-left:3px solid var(--g200);padding-left:1rem;margin-left:.04rem}
.presenter-entry{margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px dashed var(--g200)}
.presenter-entry:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.pres-paper-title{font-family:var(--serif);font-size:.94rem;font-weight:500;font-style:italic;color:var(--red-dark);margin:.3rem 0 .22rem;line-height:1.38}
.pres-kw{font-size:.7rem;color:var(--g400);margin-top:.2rem}

/* ── Nav arrows ── */
.nav-arrows{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;gap:.4rem;z-index:300;opacity:0;pointer-events:none;transition:opacity var(--tr)}
.nav-arrows.visible{opacity:1;pointer-events:auto}
.nav-arr{background:var(--g900);color:var(--white);border:none;border-radius:3px;width:34px;height:34px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.3);transition:background var(--tr)}
.nav-arr:hover{background:var(--red)}
.nav-arr:disabled{opacity:.3;cursor:default}
.nav-arr svg{width:12px;height:12px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.back-top{position:fixed;bottom:1.4rem;right:1.4rem;background:var(--red);color:var(--white);border:none;border-radius:50%;width:36px;height:36px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.22);opacity:0;pointer-events:none;transition:opacity var(--tr);display:flex;align-items:center;justify-content:center;z-index:300}
.back-top.visible{opacity:1;pointer-events:auto}.back-top:hover{background:var(--red-dark)}

@media(max-width:820px){
  .page-wrap{grid-template-columns:1fr;grid-template-areas:"hdr" "main"}
  .site-nav{display:none}
  .site-main{padding:1.2rem 1rem 3rem}
  .chairs-grid{grid-template-columns:1fr;gap:.7rem 0}
}
@media print{
  .site-nav,.back-top{display:none}
  .bio-panel,.desc-panel,.toc-day-body,.toc-slot-list{display:block!important}
  .page-wrap{display:block}
  .session-card{break-inside:avoid}
}
</style>
</head>
<body>
<div class="page-wrap">

<header class="site-header">
  <div class="hdr-logos">
    <img src="https://uaac-aauc.com/wp-content/uploads/UAAC_Logo.png" alt="UAAC–AAUC" class="hdr-logo-img" onerror="this.style.display='none'">
    <div class="hdr-divider"></div>
    <img src="https://www.concordia.ca/etc/designs/concordia/clientlibs/img/logo-concordia-university-montreal.svg" alt="Concordia University" class="hdr-logo-img concordia" onerror="this.style.display='none'">
    <div class="hdr-divider"></div>
    <div class="hdr-text">
      <span class="hdr-wordmark">UAAC – AAUC Conference Programme 2026</span>
      <span class="hdr-sub">October 13–15, 2026 &nbsp;·&nbsp; Concordia University, Montréal</span>
    </div>
  </div>
  <a class="hdr-link" href="https://uaacadmin.github.io/uaac-2026/UAAC_2026_Schedule.html" target="_blank" rel="noopener">🗓 Schedule</a>
</header>

<nav class="site-nav" id="sideNav" aria-label="Sessions">
  <div class="nav-heading">Schedule</div>
  <ul id="tocList" style="list-style:none">
    <li style="padding:.8rem 1rem;font-size:.75rem;color:var(--g400)">Loading…</li>
  </ul>
</nav>

<main class="site-main" id="siteMain">
  <div class="loading-state" id="loadingState">
    <div class="loading-spinner"></div>
    <span style="font-size:.85rem">Loading programme…</span>
  </div>
  <div id="programmeContent" style="display:none"></div>
</main>

</div>

<div class="nav-arrows" id="navArrows">
  <button class="nav-arr" id="navPrev" onclick="navStep(-1)" aria-label="Previous session" disabled>
    <svg viewBox="0 0 16 16"><path d="M11 4l-4 4 4 4"/></svg>
  </button>
  <button class="nav-arr" id="navNext" onclick="navStep(1)" aria-label="Next session">
    <svg viewBox="0 0 16 16"><path d="M5 4l4 4-4 4"/></svg>
  </button>
</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top">
  <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l5-5 5 5"/></svg>
</button>

<script>
const API_KEY      = 'AIzaSyD69jg-Vo2u9DGhKLk1OFiHPY6JXCc38Oc';
const SHEET_ID     = '1P2M1x2-N-lW1W1-ur4SP0UZ9IMTlvYQYLQ-QraGRAXo';
const SESSIONS_TAB = 'Sessions';

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }

function formatDate(d) {
  const s = String(d||'').trim();
  if (!s) return '';
  if (s.includes('13')) return 'Tuesday, October 13';
  if (s.includes('14')) return 'Wednesday, October 14';
  if (s.includes('15')) return 'Thursday, October 15';
  return s;
}

function to12h(t) {
  t = String(t||'').trim();
  if (!t) return '';
  t = t.replace(/^(\d{1,2}:\d{2}):\d{2}(\s*(am|pm))?/i, '$1$2').trim();
  let h, min, hasMeridiem = /am|pm/i.test(t);
  if (hasMeridiem) {
    const isPM = /pm/i.test(t);
    const m = t.match(/(\d{1,2}):(\d{2})/);
    if (!m) return t;
    h = parseInt(m[1]); min = m[2];
    if (isPM && h !== 12) h += 12;
    if (!isPM && h === 12) h = 0;
  } else {
    const m = t.match(/^(\d{1,2}):(\d{2})/);
    if (!m) return t;
    h = parseInt(m[1]); min = m[2];
  }
  const ap = h < 12 ? 'am' : 'pm';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${min} ${ap}`;
}

function timeRange(start, end) {
  if (!start) return '';
  const s = to12h(start), e = to12h(end);
  return e ? `${s}–${e}` : s;
}

function sessionTypeClass(type) {
  const t = (type||'').toLowerCase();
  if (t.includes('roundtable')||t.includes('table ronde')) return 'type-roundtable';
  if (t.includes('workshop')||t.includes('atelier')) return 'type-workshop';
  return 'type-panel';
}
function sessionBadge(type) {
  const t = (type||'').toLowerCase();
  if (t.includes('roundtable')||t.includes('table ronde')) return 'Table ronde / Roundtable';
  if (t.includes('workshop')||t.includes('atelier')) return 'Atelier / Workshop';
  return 'Panel Session / Séance';
}

async function fetchSessions() {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SESSIONS_TAB)}?key=${API_KEY}`;
  const r = await fetch(url);
  if (!r.ok) { const e = await r.json(); throw new Error(e.error?.message || `HTTP ${r.status}`) }
  const data = await r.json();
  const rows = data.values || [];
  if (!rows.length) return [];
  const headers = rows[0].map(h => String(h).trim());
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = (row[i] !== undefined ? String(row[i]) : '').trim(); });
    return obj;
  });
}

// ── Shared ordered-session list (built once, used by both TOC and card renderer) ──
let _orderedAnchors = []; // anchors in TOC order — the single source of truth for nav
let _navIdx = 0;          // current position in that list

// ── TOC + card order builder ──────────────────────────────────────────────────
// Returns the sorted list of session objects in TOC order (day → time → ID)
function getTOCOrder(sessions) {
  const DAY_ORDER = ['Tuesday, October 13','Wednesday, October 14','Thursday, October 15','Satellite & Off-Site — Oct 16'];
  const VALID_DAYS = new Set(DAY_ORDER.slice(0,3));
  const isOmitRoom = r => !r || /^#?n\/a$/i.test(r.trim());

  function sortById(a, b) {
    const idA=(a['ID']||'').trim(), idB=(b['ID']||'').trim();
    const mA=idA.match(/^([A-Za-z]+)(\d+)$/), mB=idB.match(/^([A-Za-z]+)(\d+)$/);
    if (mA&&mB){const lc=mA[1].toUpperCase().localeCompare(mB[1].toUpperCase());return lc!==0?lc:parseInt(mA[2])-parseInt(mB[2]);}
    return idA.localeCompare(idB);
  }

  const toMins = str => {
    const m=str.match(/(\d{1,2}):(\d{2})/); if(!m) return 9999;
    let h=parseInt(m[1]),mn=parseInt(m[2]);
    if(/pm/i.test(str)&&h!==12) h+=12; if(/am/i.test(str)&&h===12) h=0;
    return h*60+mn;
  };

  // Build day→slot→sessions structure (same logic as TOC)
  const days = {};
  function addSession(day, s) {
    const rawStart=(s['Start Time']||'').trim();
    const label=timeRange(s['Start Time'],s['End Time'])||'TBC';
    const key=rawStart||'TBC';
    if(!days[day]) days[day]={};
    if(!days[day][key]) days[day][key]={label, sessions:[]};
    days[day][key].sessions.push(s);
  }

  sessions.forEach(s => {
    const id=(s['ID']||'').trim(), room=(s['Location']||'').trim();
    if(isOmitRoom(room)) return;
    if(/^S/i.test(id)) { addSession('Satellite & Off-Site — Oct 16', s); return; }
    const day=formatDate(s['Date']);
    if(!day||!VALID_DAYS.has(day)) return;
    addSession(day, s);
  });

  // Inject Mothership into every real day/slot
  const realMothership=sessions.find(s=>(s['Location']||'').trim()==='EV5.775 junction'&&/^I/i.test((s['ID']||'').trim()));
  ['Tuesday, October 13','Wednesday, October 14','Thursday, October 15'].forEach(day=>{
    if(!days[day]) return;
    Object.values(days[day]).forEach(slotObj=>{
      if(!slotObj.sessions.some(s=>/^I/i.test((s['ID']||'').trim()))){
        slotObj.sessions.push(realMothership
          ?{...realMothership}
          :{'ID':'I','Session Title':'Mothership','Chair':'','Location':'EV5.775 junction','Start Time':'','End Time':''});
      }
    });
  });

  // Flatten into ordered array
  const sortedDays=Object.keys(days).sort((a,b)=>{
    const ai=DAY_ORDER.indexOf(a),bi=DAY_ORDER.indexOf(b);
    return (ai===-1?99:ai)-(bi===-1?99:bi);
  });

  const ordered=[];
  sortedDays.forEach(day=>{
    const sortedKeys=Object.keys(days[day]).sort((a,b)=>toMins(a)-toMins(b));
    sortedKeys.forEach(key=>{
      const sorted=[...days[day][key].sessions].sort(sortById);
      sorted.forEach(s=>ordered.push({day, slotLabel:days[day][key].label, rawKey:key, session:s}));
    });
  });

  return { ordered, days, sortedDays, toMins, sortById };
}

function buildTOC(sessions) {
  const { ordered, days, sortedDays, toMins, sortById } = getTOCOrder(sessions);
  const DAY_ORDER = ['Tuesday, October 13','Wednesday, October 14','Thursday, October 15','Satellite & Off-Site — Oct 16'];

  // Build TOC HTML from the same structure
  let html='';
  sortedDays.forEach((day,di)=>{
    const dayId=`day-${di}`;
    const label=day==='Satellite & Off-Site — Oct 16'?`🛰 ${day}`:`📅 ${day}`;
    const sortedKeys=Object.keys(days[day]).sort((a,b)=>toMins(a)-toMins(b));
    html+=`<li class="toc-day">
      <button class="toc-day-btn" onclick="toggleDay('${dayId}')" aria-expanded="true">
        <span class="toc-day-label">${esc(label)}</span>
        <svg class="toc-day-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
      </button>
      <div class="toc-day-body" id="${dayId}">`;
    sortedKeys.forEach((key,si)=>{
      const slotId=`${dayId}-slot-${si}`;
      const slotLabel=days[day][key].label;
      const sorted=[...days[day][key].sessions].sort(sortById);
      html+=`<div class="toc-slot">
        <button class="toc-slot-btn" onclick="toggleSlot('${slotId}')" aria-expanded="true">
          <span class="toc-slot-label">${esc(slotLabel)}</span>
          <svg class="toc-slot-chevron" viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <ul class="toc-slot-list" id="${slotId}">`;
      sorted.forEach(s=>{
        const id=(s['ID']||'').trim(),title=s['Session Title']||'',chair=s['Chair']||'';
        const anchor=id?`session-${id}`:`session-${encodeURIComponent(title).slice(0,40)}`;
        html+=`<li class="toc-item"><a href="#${esc(anchor)}" class="toc-link" onclick="tocNavClick(this)">
          <span class="toc-num">${esc(id)||'—'}</span>
          <span class="toc-text">
            <span class="toc-title">${esc(title)}</span>
            ${chair?`<span class="toc-chair">${esc(chair)}</span>`:''}
          </span></a></li>`;
      });
      html+=`</ul></div>`;
    });
    html+=`</div></li>`;
  });
  document.getElementById('tocList').innerHTML=html;

  // Store ordered anchor list for navigation
  _orderedAnchors = ordered.map(o => {
    const id=(o.session['ID']||'').trim();
    const title=o.session['Session Title']||'';
    return id?`session-${id}`:`session-${encodeURIComponent(title).slice(0,40)}`;
  });
  _navIdx = 0;
  updateNavButtons();
}

function buildProgramme(sessions) {
  // Get TOC order, then render cards in that exact order
  const { ordered } = getTOCOrder(sessions);

  // Build a lookup from anchor id → session data (for rich card rendering)
  const sessionByAnchor = {};
  sessions.forEach(s => {
    const id=(s['ID']||'').trim(), title=s['Session Title']||'';
    const anchor=id?`session-${id}`:`session-${encodeURIComponent(title).slice(0,40)}`;
    sessionByAnchor[anchor]=s;
  });

  // Render cards in TOC order
  let html='';
  const seen=new Set();
  ordered.forEach(o=>{
    const id=(o.session['ID']||'').trim(), title=o.session['Session Title']||'';
    const anchor=id?`session-${id}`:`session-${encodeURIComponent(title).slice(0,40)}`;
    if(seen.has(anchor)) return; // skip duplicates (Mothership injected multiple times)
    seen.add(anchor);

    // Prefer the real session data from the sheet over the injected stub
    const s=sessionByAnchor[anchor]||o.session;
    const type=s['Type of session']||'',location=s['Location']||'';
    const date=formatDate(s['Date']),tr=timeRange(s['Start Time'],s['End Time']);
    const chair=s['Chair']||'',chairAff=s['Chair Affiliation']||'',chairBio=s['Chair Bio']||'';
    const cochair=s['Co-chair']||'',cochairAff=s['Co-chair Affiliation']||'',cochairBio=s['Co-chair Bio']||'';
    const desc=s['Session Description']||'',kw=s['Session Keywords']||'';
    const tcls=sessionTypeClass(type),badge=sessionBadge(type);

    html+=`<article class="session-card" id="${esc(anchor)}">
      <div class="session-header ${tcls}">
        <div class="session-header-top">
          <span class="session-badge">${esc(badge)}</span>
          ${(date||tr)?`<div class="session-schedule">
            ${date?`<span class="sched-date">${esc(date)}</span>`:''}
            ${date&&tr?`<span class="sched-sep">·</span>`:''}
            ${tr?`<span class="sched-time">${esc(tr)}</span>`:''}
          </div>`:''}
        </div>
        <h2 class="session-title">${id?`<span class="session-id-pill">${esc(id)}</span>`:''} ${esc(title)}</h2>
        ${location?`<div class="session-meta"><span class="meta-loc">● ${esc(location)}</span></div>`:''}
      </div>
      <div class="session-body">`;

    if(chair||cochair){
      html+=`<div class="chairs-grid">`;
      [[chair,chairAff,chairBio,'c1','Chair / Président(e)'],[cochair,cochairAff,cochairBio,'c2','Co-chair / Co-président(e)']].forEach(([name,affil,bio,key,role])=>{
        html+=`<div class="person-col">`;
        if(name){
          html+=`<div class="person-role">${role}</div><div class="person-name-row"><span class="person-name">${esc(name)}</span>`;
          if(bio) html+=`<button class="bio-toggle" onclick="togglePanel(this,'bio-${key}-${esc(anchor)}')" aria-expanded="false">Bio
            <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
            <div class="bio-panel" id="bio-${key}-${esc(anchor)}" hidden><p>${esc(bio)}</p></div>`;
          html+=`</div>`;
          if(affil) html+=`<div class="person-affil">${esc(affil)}</div>`;
        }
        html+=`</div>`;
      });
      html+=`</div>`;
    }
    if(desc||kw){
      html+=`<hr class="session-rule">`;
      if(desc) html+=`<div class="session-description"><p>${esc(desc)}</p></div>`;
      if(kw)   html+=`<div class="session-keywords"><span class="field-label">Keywords</span><span class="kw-text">${esc(kw)}</span></div>`;
    }
    const panelists=[];
    for(let n=1;n<=7;n++){
      const name=s[`Panelist ${n} `]||s[`Panelist ${n}`]||''; if(!name) continue;
      panelists.push({name,affil:s[`Panelist ${n} Affiliation`]||'',bio:s[`Panelist ${n} Bio`]||'',
        paper:s[`Panelist ${n} Paper`]||'',desc:s[`Panelist ${n} Description`]||'',
        kw:s[`Panelist ${n} Keywords`]||s[`Panelist ${n} Keywords `]||''});
    }
    if(panelists.length){
      html+=`<div class="presentations-section"><div class="presentations-heading"><span class="field-label">Presentations / Communications</span></div><div class="presentations-indent">`;
      panelists.forEach((p,pi)=>{
        const bioId=`bio-p${pi+1}-${esc(anchor)}`,descId=`desc-p${pi+1}-${esc(anchor)}`;
        html+=`<div class="presenter-entry"><div class="person-name-row"><span class="person-name pres-name">${esc(p.name)}</span>`;
        if(p.bio) html+=`<button class="bio-toggle" onclick="togglePanel(this,'${bioId}')" aria-expanded="false">Bio
          <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
          <div class="bio-panel" id="${bioId}" hidden><p>${esc(p.bio)}</p></div>`;
        html+=`</div>`;
        if(p.affil) html+=`<div class="person-affil">${esc(p.affil)}</div>`;
        if(p.paper) html+=`<div class="pres-paper-title">${esc(p.paper)}</div>`;
        if(p.desc) html+=`<button class="desc-toggle" onclick="togglePanel(this,'${descId}')" aria-expanded="false">Abstract
          <svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
          <div class="desc-panel" id="${descId}" hidden><p>${esc(p.desc)}</p></div>`;
        if(p.kw) html+=`<div class="pres-kw"><span class="field-label">Keywords</span><span class="kw-text">${esc(p.kw)}</span></div>`;
        html+=`</div>`;
      });
      html+=`</div></div>`;
    }
    html+=`</div></article>`;
  });

  document.getElementById('programmeContent').innerHTML=html;
  document.getElementById('programmeContent').style.display='';
  document.getElementById('loadingState').style.display='none';
  buildTOC(sessions);
  initScrollSpy();
}

// ── Navigation: step through TOC order ───────────────────────────────────────
function togglePanel(btn,id){
  const p=document.getElementById(id);
  const o=btn.getAttribute('aria-expanded')==='true';
  btn.setAttribute('aria-expanded',String(!o));
  p.hidden=o;
}
function toggleDay(id){
  const b=document.getElementById(id);
  const btn=b.previousElementSibling;
  const c=b.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded',String(!c));
}
function toggleSlot(id){
  const l=document.getElementById(id);
  const btn=l.previousElementSibling;
  const c=l.classList.toggle('collapsed');
  btn.setAttribute('aria-expanded',String(!c));
}

function navStep(dir) {
  const next = _navIdx + dir;
  if (next < 0 || next >= _orderedAnchors.length) return;
  _navIdx = next;
  const anchor = _orderedAnchors[_navIdx];
  const el = document.getElementById(anchor);
  if (el) el.scrollIntoView({behavior:'smooth', block:'start'});
  setActiveByAnchor(anchor);
  updateNavButtons();
}

function tocNavClick(linkEl) {
  // When user clicks a TOC link, sync _navIdx to that position
  const href = linkEl.getAttribute('href').replace('#','');
  const i = _orderedAnchors.indexOf(href);
  if (i >= 0) { _navIdx = i; updateNavButtons(); }
}

function setActiveByAnchor(anchor) {
  document.querySelectorAll('.toc-link').forEach(l => {
    const active = l.getAttribute('href') === '#' + anchor;
    l.classList.toggle('active', active);
  });
  const a = document.querySelector('.toc-link.active');
  if (a) {
    const sl=a.closest('.toc-slot-list'),db=a.closest('.toc-day-body');
    if(sl&&sl.classList.contains('collapsed')) toggleSlot(sl.id);
    if(db&&db.classList.contains('collapsed')) toggleDay(db.id);
    a.scrollIntoView({block:'nearest',behavior:'smooth'});
  }
}

function updateNavButtons() {
  const prev=document.getElementById('navPrev'), next=document.getElementById('navNext');
  if(prev) prev.disabled = _navIdx <= 0;
  if(next) next.disabled = _navIdx >= _orderedAnchors.length - 1;
}

// ── Scroll spy: updates active TOC item and _navIdx on scroll ────────────────
function initScrollSpy() {
  const cards = document.querySelectorAll('.session-card');
  const obs = new IntersectionObserver(entries => {
    // Find the topmost visible card
    let topCard = null, topY = Infinity;
    entries.forEach(e => {
      if (e.isIntersecting) {
        const y = e.boundingClientRect.top;
        if (y >= 0 && y < topY) { topY = y; topCard = e.target; }
      }
    });
    if (!topCard) return;
    const anchor = topCard.id;
    const i = _orderedAnchors.indexOf(anchor);
    if (i >= 0 && i !== _navIdx) { _navIdx = i; updateNavButtons(); }
    setActiveByAnchor(anchor);
  }, {rootMargin:'-8% 0px -82% 0px', threshold:0});
  cards.forEach(c => obs.observe(c));

  // Show nav arrows after load
  document.getElementById('navArrows').classList.add('visible');
}

// Keyboard arrow support
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && !e.shiftKey) { e.preventDefault(); navStep(1); }
  if (e.key === 'ArrowUp'   && !e.shiftKey) { e.preventDefault(); navStep(-1); }
});

const btt=document.getElementById('backTop');
window.addEventListener('scroll',()=>{btt.classList.toggle('visible',window.scrollY>500)},{passive:true});

(async function(){
  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(SESSIONS_TAB)}?key=${API_KEY}`;
    const r=await fetch(url);
    if(!r.ok){const e=await r.json();throw new Error(e.error?.message||`HTTP ${r.status}`)}
    const data=await r.json();
    const rows=data.values||[];
    if(!rows.length) throw new Error('Sessions tab is empty.');
    const headers=rows[0].map(h=>String(h).trim());
    const sessions=rows.slice(1).map(row=>{
      const obj={};
      headers.forEach((h,i)=>{obj[h]=(row[i]!==undefined?String(row[i]):'').trim()});
      return obj;
    });
    buildProgramme(sessions);
  }catch(err){
    document.getElementById('loadingState').innerHTML=
      `<div class="error-state"><strong>Could not load programme data</strong><p>${esc(err.message)}</p></div>`;
  }
})();
</script>
